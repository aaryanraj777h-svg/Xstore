<style>
:root{--bg:#fff;--sf:#f1f3f9;--tx:#1b1b1f;--mu:#5f6368;--ac:#6d4cff;--lk:#5a3df0;--bd:#e4e6ee;--ok:#0f8a4a;--ct:#ece8ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131316;--sf:#202127;--tx:#e6e6ea;--mu:#9a9fb0;--bd:#2c2e38;--lk:#b6a9ff;--ok:#3ddc84;--ct:#2b2650;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131316;--sf:#202127;--tx:#e6e6ea;--mu:#9a9fb0;--bd:#2c2e38;--lk:#b6a9ff;--ok:#3ddc84;--ct:#2b2650;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Google Sans","Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:12}
h1,h2,h3{margin:.3em 0;letter-spacing:-.01em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:14px;align-items:center;padding:10px 16px;background:var(--bg);animation:drop .6s cubic-bezier(.2,.8,.2,1) both}
.brand{display:flex;gap:8px;align-items:center;font-weight:800;font-size:21px;letter-spacing:.03em;color:var(--tx);text-decoration:none}
.brand img{border-radius:10px;animation:fl 5s ease-in-out infinite;box-shadow:0 0 14px #7b5cff88}
.srch{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--sf);border-radius:99px;color:var(--mu);transition:box-shadow .3s}
.srch:focus-within{box-shadow:0 0 0 2px var(--ac)}
.srch input{border:0;background:none;outline:0;padding:12px 0;width:100%;font:inherit;color:var(--tx)}
.rail{position:fixed;z-index:10;display:flex;background:var(--bg)}
.rail a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;color:var(--mu);text-decoration:none;font-size:12px;font-weight:600}
.pill{padding:4px 18px;border-radius:99px;transition:background .3s,transform .3s}
.rail a:hover .pill{background:var(--sf);transform:scale(1.08)}
.rail a.on{color:var(--tx)}.rail a.on .pill{background:var(--ct);color:var(--lk)}
@media(max-width:819px){.rail{left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--bd)}main{padding-bottom:96px!important}.brand span{display:none}}
@media(min-width:820px){.rail{left:0;top:calc(66px + env(safe-area-inset-top,0px));width:88px;flex-direction:column;flex:none;gap:6px;padding-top:8px}.rail a{flex:none}main{padding-left:104px!important}}
main{max-width:1240px;margin:0 auto;padding:6px 16px 28px}
#v>*{animation:pg .5s cubic-bezier(.2,.8,.2,1) both}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lk);outline-offset:2px}
small,.mu{color:var(--mu)}
.hero{position:relative;border-radius:20px;overflow:hidden;margin:8px 0 22px}
.trk{display:flex;transition:transform .8s cubic-bezier(.65,0,.25,1)}
.slide{position:relative;flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:34px 44px 44px;min-height:240px;background:linear-gradient(115deg,var(--c),#0b1030 92%);color:#fff;text-decoration:none;overflow:hidden}
.slide .sl{position:relative;max-width:480px}
.slide h2{font-size:32px;margin:4px 0}.slide p{margin:0 0 16px;opacity:.9}.slide small{color:#ffffffcc}
.slide>svg:last-child{position:relative;flex:none;animation:fl 4s ease-in-out infinite}
.con{position:absolute;right:0;top:0;height:100%;width:50%;opacity:.7}
.con path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 3s .3s forwards}
.con circle,.tw{animation:tw 2.6s ease-in-out infinite}
.con circle:nth-child(2n),.tw:nth-child(2n){animation-delay:.8s}.con circle:nth-child(3n),.tw:nth-child(3n){animation-delay:1.5s}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:6px;justify-content:center}
.dot{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:#ffffff77;cursor:pointer;transition:width .35s,background .35s}
.dot.on{width:28px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{flex:none;padding:7px 16px;border:1px solid var(--bd);border-radius:99px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;transition:transform .25s,background .25s;animation:pop .5s both}
.chip:hover{transform:translateY(-3px);background:var(--sf)}
.chip.on{background:var(--ct);border-color:transparent;color:var(--lk);font-weight:700}
.sec{margin:6px 0 22px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.sh h2{font-size:21px;margin:0}
.hs{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 0 10px}
.tile{flex:0 0 118px;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:14px;color:var(--tx);text-decoration:none;scroll-snap-align:start;transition:background .25s,transform .3s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.tile:hover{background:var(--sf);transform:translateY(-4px)}
.tile>svg{margin-bottom:6px;transition:transform .35s}
.tile:hover>svg{transform:scale(1.08) rotate(-4deg)}
.tile b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--mu)}
.item{display:flex;gap:14px;align-items:center;padding:10px;border-radius:14px;color:var(--tx);text-decoration:none;transition:background .25s;animation:rise .5s both;animation-delay:calc(var(--i,0)*50ms)}
.item:hover{background:var(--sf)}
.item .g{flex:1;min-width:0}.item b{display:block}
.btn{position:relative;overflow:hidden;display:inline-flex;gap:6px;align-items:center;justify-content:center;height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--ac)}
.btn:active{transform:scale(.96)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::after{left:130%}
.btn.alt{background:none;color:var(--lk);box-shadow:inset 0 0 0 1.5px var(--bd)}
.btn.wh{background:#fff;color:#1b1b1f}
.btn.busy::before{content:"";position:absolute;inset:0;background:#ffffff59;transform-origin:left;animation:fill 1.1s linear forwards}
.btn:disabled{cursor:progress}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;align-items:center}
.ok{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-weight:700}
.chk path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .1s forwards}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--lk);text-decoration:none;font-weight:600;padding:6px 0}
.dh{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.dh>svg{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.dh h1{font-size:34px;margin:0}
.dev{color:var(--lk);font-weight:700}
.stats{display:flex;overflow-x:auto;margin:6px 0 4px}
.stats>div{flex:1;min-width:96px;text-align:center;padding:4px 12px;border-left:1px solid var(--bd);animation:pg .6s both;animation-delay:calc(var(--i,0)*90ms)}
.stats>div:first-child{border-left:0}
.stats b{display:flex;gap:4px;justify-content:center;align-items:center;font-size:16px}
.stats small{display:block}
.age{display:inline-grid;place-items:center;width:22px;height:22px;border:2px solid var(--mu);border-radius:5px;font-size:11px}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.shots>*{flex:none;height:300px;border-radius:14px;scroll-snap-align:start;animation:rise .6s both;animation-delay:calc(var(--i,0)*90ms)}
.shots img{width:auto;max-width:80vw;border:1px solid var(--bd);cursor:zoom-in;transition:transform .3s}
.shots img:hover{transform:scale(1.03)}
.mock{width:169px;padding:14px;display:flex;flex-direction:column;gap:10px;color:#fff;background:linear-gradient(160deg,var(--c),#0b1030)}
.mock .mh{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.mock i{display:block;height:16px;border-radius:8px;background:#ffffff40;transform-origin:left;animation:shim 2s ease-in-out infinite alternate}
.mock .mf{margin-top:auto;height:34px;border-radius:12px;background:#ffffff33}
.desc{white-space:pre-wrap;max-width:72ch}
.star{background:none;border:0;color:var(--mu);cursor:pointer;padding:2px;transition:transform .25s,color .25s}
.star:hover{transform:scale(1.3) rotate(-10deg);color:var(--ac)}
.rb{display:flex;gap:18px;align-items:center}.rb b{font-size:54px;line-height:1}
.info{max-width:520px}.info div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.tg{display:inline-block;padding:4px 14px;border:1px solid var(--bd);border-radius:99px;font-size:13px}
.panel{background:var(--sf);border-radius:16px;padding:20px;max-width:560px}
textarea,input[type=file]{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.err{color:#d92d4a;min-height:1.3em;margin:8px 0;font-size:14px}
.lb{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#05081ad9;animation:fade .25s both;cursor:zoom-out}
.lb img{max-width:92vw;max-height:88vh;border-radius:14px;animation:pop .35s both}
.lb.out{animation:fade .25s reverse both}
.empty{text-align:center;padding:36px 10px}
.planet{color:var(--mu);animation:fl 5s ease-in-out infinite}
.empty p{max-width:46ch;margin:0 auto 16px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.9);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(min-width:820px){#toast{bottom:28px}}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--mu);transition:background .3s,transform .3s}
.ib:hover{background:var(--sf);transform:rotate(-8deg) scale(1.08)}
.dlslot{margin:14px 0 6px}
.btn.wide{min-width:240px}
.btn:disabled:not(.busy){opacity:.55;cursor:not-allowed}
.btn.on svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.dl{max-width:560px;padding:14px 16px;border-radius:16px;background:var(--sf);margin:6px 0;animation:pop .4s both}
.dlh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.pct{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.dlb{height:10px;border-radius:10px;background:var(--bd);overflow:hidden}
.dlb i{display:block;height:100%;width:0;border-radius:10px;background:repeating-linear-gradient(120deg,var(--ac) 0 12px,#8f78ff 12px 24px);background-size:40px 100%;animation:strp .6s linear infinite}
.dl.fin .dlb i{background:var(--ok);animation:none}
.dl small{display:block;margin-top:8px}
.pick{display:flex;gap:2px;margin:6px 0}
.star.on{color:var(--ac)}
.rv{padding:14px;border-radius:14px;background:var(--sf);max-width:560px;margin:10px 0}
.rv .rt{color:var(--tx)}
.rv p{margin:6px 0;white-space:pre-wrap}
.rv textarea{margin:6px 0}
@keyframes strp{to{background-position:40px 0}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#05060f;cursor:pointer;animation:sout .6s 2.4s both}
#splash img{width:min(80vmin,540px);height:auto;border-radius:26px;animation:sin 1.3s cubic-bezier(.2,.8,.2,1) both,glow 2.4s ease-in-out infinite}
#splash i{position:absolute;bottom:calc(7vh + env(safe-area-inset-bottom,0px));left:50%;width:150px;height:3px;margin-left:-75px;border-radius:3px;background:#ffffff22;overflow:hidden}
#splash i::after{content:"";display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,#22d3ee,#c026d3);animation:fill 2.3s linear both}
@keyframes sin{from{opacity:0;transform:scale(.8);filter:blur(14px)}}
@keyframes sout{to{opacity:0;visibility:hidden}}
@keyframes glow{50%{box-shadow:0 0 60px #7b5cff99}}
@keyframes pg{from{opacity:0;transform:translateY(14px)}}
@keyframes drop{from{transform:translateY(-100%);opacity:0}}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes tw{50%{opacity:.2}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes fade{from{opacity:0}}
@keyframes shim{to{opacity:.45;transform:scaleX(.92)}}
@media(max-width:560px){.slide{padding:22px 18px 40px;min-height:200px}.slide h2{font-size:23px}.slide>svg:last-child{width:76px;height:76px}.dh h1{font-size:26px}.shots>*{height:250px}.mock{width:141px}}
